<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledger recording</title>
    <style>
      :root {
        color-scheme: light dark;
        --indicator-bg: #fffaf6;
        --indicator-fg: #242321;
        --indicator-accent: #ff5f40;
        --indicator-handle: rgba(255, 95, 64, .5);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --indicator-bg: #242321;
          --indicator-fg: #f7f3ee;
          --indicator-handle: rgba(255, 95, 64, .72);
        }
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { display: grid; place-items: center; }
      button {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        width: 52px; height: 88px; padding: 0; border: 0; outline: 0;
        border-radius: 27px; color: var(--indicator-fg); background: var(--indicator-bg);
        box-shadow: none;
        cursor: pointer; -webkit-app-region: no-drag;
      }
      button:focus-visible { outline: 2px solid var(--indicator-accent); outline-offset: 3px; }
      .dot { flex: 0 0 20px; width: 20px; height: 20px; margin: 0 0 12px; border: 3px solid var(--indicator-fg); border-radius: 50%; position: relative; }
      .dot::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--indicator-accent); }
      .bars { flex: 0 0 15px; display: flex; align-items: end; justify-content: center; gap: 3px; width: 20px; height: 15px; }
      .bars i { display: block; flex: 0 0 3px; width: 3px; border-radius: 2px; background: var(--indicator-accent); }
      .bars i:nth-child(1) { height: 8px; } .bars i:nth-child(2) { height: 15px; } .bars i:nth-child(3) { height: 11px; }
      .bars i { transition: height 120ms ease, opacity 120ms ease; }
      body[data-activity="silent"] .bars i { height: 5px; opacity: .65; }
      body[data-activity="low"] .bars i:nth-child(1) { height: 6px; }
      body[data-activity="low"] .bars i:nth-child(2) { height: 9px; }
      body[data-activity="low"] .bars i:nth-child(3) { height: 7px; }
      body[data-activity="medium"] .bars i:nth-child(1) { height: 9px; }
      body[data-activity="medium"] .bars i:nth-child(2) { height: 13px; }
      body[data-activity="medium"] .bars i:nth-child(3) { height: 11px; }
      body[data-activity="high"] .bars i:nth-child(1) { animation: live-bars 520ms ease-in-out infinite alternate; }
      body[data-activity="high"] .bars i:nth-child(2) { animation: live-bars 430ms ease-in-out infinite alternate-reverse; }
      body[data-activity="high"] .bars i:nth-child(3) { animation: live-bars 610ms ease-in-out infinite alternate; }
      body[data-paused="true"] .dot::after { background: var(--indicator-fg); opacity: .45; }
      body[data-paused="true"] .bars i { height: 5px; opacity: .5; animation: none; }
      .drag-handle { position: absolute; left: 17px; right: 17px; bottom: 7px; height: 5px; border-radius: 5px; background: var(--indicator-handle); -webkit-app-region: drag; }
      @keyframes live-bars { from { height: 6px; } to { height: 15px; } }
    </style>
  </head>
  <body>
    <button type="button" aria-label="Return to active meeting note">
      <span class="dot" aria-hidden="true"></span>
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="drag-handle" aria-hidden="true"></span>
    </button>
    <script>
      const applyState = (state) => {
        document.body.dataset.activity = state.activity;
        document.body.dataset.paused = String(state.paused);
      };
      window.desktopWindow?.onMeetingIndicatorState(applyState);
      applyState({ recording: true, paused: false, activity: 'silent' });
      document.querySelector('button').addEventListener('click', (event) => {
        if (event.target.closest('.drag-handle')) return;
        void window.desktopWindow?.meetingIndicatorClick();
      });
    </script>
  </body>
</html>
